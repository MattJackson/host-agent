# Version updates are monthly and grouped into one PR per ecosystem.
# Security updates are separate and run whenever an advisory is published.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  commit-message:
    prefix: deps
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  commit-message:
    prefix: deps
  groups:
    all:
      patterns:
      - '*'
