name: mac-agent binaries

on:
  push:
    branches: [mac-agent]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build darwin/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false  # no go.sum: stdlib-only module
      # Cross-compiled without cgo, so no temperature sensors in this build.
      # The cgo sensor reader (sensors_darwin.go) needs a macOS runner.
      - name: Build
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="$(git rev-parse --short=12 HEAD)"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=mac-$VERSION" \
            -o "dist/mac-agent-darwin-${GOARCH}" ./cmd/mac-agent
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: mac-agent-darwin-${{ matrix.arch }}
          path: dist/
