name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: go test + gofmt + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          check-latest: true

      - name: gofmt -s -l
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt issues:"
            echo "$out"
            exit 1
          fi

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test -race -count=1 ./...

  build:
    name: docker build (smoke test)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: host-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime state is tmpfs
        run: |
          docker run -d --privileged --name host-agent-smoke \
            -e PROMETHEUS_REMOTE_WRITE_URL=http://127.0.0.1:9090/api/v1/write \
            host-agent:ci
          trap 'docker rm -f host-agent-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec host-agent-smoke awk \
              '$2 == "/run/host-agent" && $3 == "tmpfs" { found = 1 } END { exit !found }' \
              /proc/mounts; then
              exit 0
            fi
            sleep 1
          done
          docker logs host-agent-smoke
          echo "host-agent runtime state is not mounted as tmpfs" >&2
          exit 1
